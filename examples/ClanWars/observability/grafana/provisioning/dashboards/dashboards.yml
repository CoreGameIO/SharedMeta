apiVersion: 1

# Auto-load any *.json dashboard from /var/lib/grafana/dashboards (mounted from the
# host repo via docker-compose volume). Dashboards are read-only here — Grafana
# UI edits don't persist back to git unless you "Export → Save to file" manually.

providers:
  - name: "SharedMeta"
    orgId: 1
    folder: "SharedMeta"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

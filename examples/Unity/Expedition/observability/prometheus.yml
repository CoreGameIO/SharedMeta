# Prometheus config — scrapes Unity Expedition.Server /metrics running on the host (:5000).

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "unity-expedition-server"
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          service: "Unity.Expedition.Server"
          env: "dev"
    metrics_path: /metrics
    scheme: http
